  <line x1="396" y1="340" x2="434" y2="340" stroke="#856a38" stroke-width="4" marker-end="url(#arrow2)"/>
  <line x1="766" y1="340" x2="804" y2="340" stroke="#856a38" stroke-width="4" marker-end="url(#arrow2)"/>
