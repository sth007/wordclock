<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef7f3"/>
      <stop offset="100%" stop-color="#e0f0e8"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#6c9b85" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e6c54"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="url(#bg3)"/>

  <text x="60" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#204638">Build &amp; Deploy Flow</text>
  <text x="60" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#3f6d5a">Recommended PlatformIO commands for this project</text>

  <rect x="70" y="175" rx="18" ry="18" width="250" height="120" fill="#fff" stroke="#a9d1bf" stroke-width="2" filter="url(#shadow3)"/>
  <text x="95" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#24513f">1. Build</text>
  <text x="95" y="262" font-family="Consolas, Menlo, monospace" font-size="18" fill="#2e6c54">pio run -e esp32-c3</text>

  <rect x="385" y="175" rx="18" ry="18" width="370" height="120" fill="#fff" stroke="#a9d1bf" stroke-width="2" filter="url(#shadow3)"/>
  <text x="410" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#24513f">2. Upload Firmware</text>
  <text x="410" y="262" font-family="Consolas, Menlo, monospace" font-size="18" fill="#2e6c54">pio run -t upload -e esp32-c3</text>

  <rect x="820" y="175" rx="18" ry="18" width="310" height="120" fill="#fff" stroke="#a9d1bf" stroke-width="2" filter="url(#shadow3)"/>
  <text x="845" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#24513f">3. Upload UI</text>
  <text x="845" y="262" font-family="Consolas, Menlo, monospace" font-size="18" fill="#2e6c54">pio run -t uploadfs</text>

  <line x1="320" y1="235" x2="385" y2="235" stroke="#2e6c54" stroke-width="4" marker-end="url(#arrow3)"/>
  <line x1="755" y1="235" x2="820" y2="235" stroke="#2e6c54" stroke-width="4" marker-end="url(#arrow3)"/>

  <rect x="70" y="345" rx="20" ry="20" width="1060" height="220" fill="#ffffff" stroke="#a9d1bf" stroke-width="2" filter="url(#shadow3)"/>
  <text x="100" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#24513f">When to run uploadfs?</text>
  <text x="100" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#355f50">Any time files in</text>
  <text x="350" y="438" font-family="Consolas, Menlo, monospace" font-size="23" font-weight="700" fill="#2e6c54">data/www/</text>
  <text x="500" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#355f50">change (HTML/CSS/JS).</text>
  <text x="100" y="476" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#355f50">Without this step, the ESP32 still serves the old web UI from LittleFS.</text>

  <rect x="100" y="500" rx="10" ry="10" width="625" height="45" fill="#e8f6ef" stroke="#9bcbb6"/>
  <text x="118" y="529" font-family="Consolas, Menlo, monospace" font-size="20" fill="#1f4f3e">pio run -t uploadfs -e esp32-c3</text>
</svg>
