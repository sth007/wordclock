<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Wordclock Config</title>
</head>
<body style="font-family:sans-serif; max-width:520px; margin:40px auto;">
    <h2>Konfiguration</h2>
    <p>Aktuelle Uhrzeit: {{currentTime}}</p>
    <form method="POST" action="/config">
        <label>NTP-Server</label><br>
        <input name="ntpServer" value="{{ntpServer}}" style="width:100%;padding:10px"><br><br>
        <label>GMT Offset (Stunden)</label><br>
        <input name="gmtOffset" type="number" value="{{gmtOffset}}" style="width:100%;padding:10px"><br><br>
        <label>Sommerzeit Offset (Stunden)</label><br>
        <input name="daylightOffset" type="number" value="{{daylightOffset}}" style="width:100%;padding:10px"><br><br>
        <label>Helligkeit (1-10)</label><br>
        <input name="brightness" type="number" min="1" max="10" value="{{brightness}}" style="width:100%;padding:10px"><br><br>
        <label>LED-Pin</label><br>
        <input name="ledPin" type="number" value="{{ledPin}}" style="width:100%;padding:10px"><br><br>
        <label>LEDs pro Reihe</label><br>
        <input name="ledsPerRow" type="number" value="{{ledsPerRow}}" style="width:100%;padding:10px"><br><br>
        <label>Wortzeilen</label><br>
        <input name="wordRows" type="number" value="{{wordRows}}" style="width:100%;padding:10px"><br><br>
        <label>SSID</label><br>
        <input name="ssid" value="{{ssid}}" style="width:100%;padding:10px"><br><br>
        <label>Passwort</label><br>
        <input name="pass" type="password" style="width:100%;padding:10px"><br><br>
        <button type="submit" style="padding:10px 18px">Speichern & Neustarten</button>
    </form>
    <br>
    <a href="/">Zurück</a>
</body>
</html>
