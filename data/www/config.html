<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Wordclock Config</title>
    <style>
        body { font-family: sans-serif; max-width: 1100px; margin: 24px auto; padding: 0 16px; }
        .grid { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; gap: 20px; align-items: start; }
        .card { background: #f8f8f8; border: 1px solid #ddd; border-radius: 6px; padding: 14px; }
        .card h3 { margin: 0 0 10px 0; }
        form input, form select { width: 100%; padding: 10px; box-sizing: border-box; }
        form label { font-weight: 600; display: block; margin-bottom: 4px; }
        .btn { padding: 10px 14px; border: none; border-radius: 4px; cursor: pointer; background: #007bff; color: #fff; }
        .btn:hover { background: #005fc5; }
        .btn.secondary { background: #0a8f3f; }
        .btn.secondary:hover { background: #086f32; }
        .row { margin-bottom: 12px; }
        #statusText { margin-top: 8px; min-height: 20px; }
        #clockInfo { margin: 8px 0 12px 0; font-size: 14px; }
        #clockInfo strong { color: #111; }
        #healthInfo { margin: 8px 0 12px 0; font-size: 13px; border: 1px solid #ddd; border-radius: 4px; padding: 8px; background: #fff; }
        #healthInfo div { margin: 3px 0; }
        #healthInfo strong { color: #111; }
        #ledMatrix { overflow-x: auto; border: 1px solid #ddd; border-radius: 4px; background: #fff; padding: 6px; }
        #ledMatrix table { border-collapse: collapse; }
        #ledMatrix th { width: 18px; height: 18px; font-size: 10px; color: #666; border: 1px solid transparent; text-align: center; }
        #ledMatrix td { width: 18px; height: 18px; border: 1px solid #999; background: #ddd; }
        #ledMatrix td.active { background: #ffeb3b; }
        #ledMatrix td.preview { background: #ff9800; }
        #ledMatrix td.active.preview { background: #f9c634; }
        #wordButtonsRows { margin-bottom: 10px; }
        .word-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 6px 0; }
        .word-row-label { min-width: 70px; color: #333; font-size: 13px; font-weight: 600; }
        .word-btn { border: 1px solid #999; background: #f1f1f1; color: #222; border-radius: 4px; padding: 5px 9px; font-size: 12px; cursor: pointer; }
        .word-btn.active { background: #ff9800; border-color: #d97e00; color: #fff; }
        .btn.small { padding: 6px 10px; font-size: 12px; }
        .origin-buttons { display: grid; grid-template-columns: repeat(2, minmax(120px, 1fr)); gap: 8px; }
        .origin-btn { border: 2px solid #999; background: #f1f1f1; color: #222; border-radius: 4px; padding: 10px; font-size: 13px; cursor: pointer; text-align: center; }
        .origin-btn.active { background: #ffc107; border-color: #ff9800; font-weight: 700; }
        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <h2 id="titleText">Konfiguration</h2>
        <label><span id="langLabel">Sprache:</span>
            <select id="langSelect"><option value="de">DE</option><option value="en">EN</option></select>
        </label>
    </div>
    <div class="grid">
        <div class="card">
            <h3 id="settingsTitle">Einstellungen</h3>
            <div id="clockInfo">
                <div><span id="lblCurrentTime">Aktuelle Uhrzeit:</span> <strong id="currentTime">{{currentTime}}</strong></div>
                <div><span id="lblTimeWords">Zeit in Worten:</span> <strong id="timeWords">{{timeWords}}</strong></div>
                <div><span id="lblTestMode">Testmodus:</span> <strong id="testMode">{{testMode}}</strong>, <span id="lblFirstLed">Erste LED:</span> <strong id="firstLEDMode">{{firstLEDMode}}</strong></div>
            </div>
            <div id="healthInfo">
                <div><span id="lblNet">Netz:</span> <strong id="healthWifi">-</strong></div>
                <div>IP: <strong id="healthIp">-</strong></div>
                <div>RSSI: <strong id="healthRssi">-</strong></div>
                <div>Heap: <strong id="healthHeap">-</strong></div>
                <div><span id="lblUptime">Uptime:</span> <strong id="healthUptime">-</strong></div>
                <div><span id="lblLastEvent">Letzter WiFi-Event:</span> <strong id="healthEvent">-</strong></div>
                <div><span id="lblDiscReason">Disconnect Grund:</span> <strong id="healthDiscReason">-</strong></div>
            </div>
            <div class="row">
                <button id="btnNormalTime" type="button" class="btn secondary" onclick="activateNormalTime()">Uhrzeitanzeige aktivieren</button>
                <div id="statusText"></div>
            </div>
            <form method="POST" action="/config">
                <div class="row">
                    <label id="lblNtp">NTP-Server</label>
                    <input name="ntpServer" value="{{ntpServer}}">
                </div>
                <div class="row">
                    <label id="lblTimezone">Zeitzone (Stadt)</label>
                    <select id="timezoneCity" name="timezoneCity">
                        <option value="berlin">Berlin</option>
                        <option value="london">London</option>
                        <option value="newyork">New York</option>
                        <option value="chicago">Chicago</option>
                        <option value="denver">Denver</option>
                        <option value="losangeles">Los Angeles</option>
                        <option value="tokyo">Tokyo</option>
                        <option value="sydney">Sydney</option>
                    </select>
                </div>
                <div class="row">
                    <label id="lblBrightness">Helligkeit (1-10)</label>
                    <input name="brightness" type="number" min="1" max="10" value="{{brightness}}">
                </div>
                <div class="row">
                    <label id="lblLedPin">LED-Pin</label>
                    <input name="ledPin" type="number" value="{{ledPin}}">
                </div>
                <div class="row">
                    <label id="lblLedsPerRow">LEDs pro Reihe</label>
                    <input name="ledsPerRow" type="number" value="{{ledsPerRow}}">
                </div>
                <div class="row">
                    <label id="lblWordRows">Wortzeilen</label>
                    <input name="wordRows" type="number" value="{{wordRows}}">
                </div>
                <div class="row">
                    <label id="lblOrigin">LED-Startpunkt</label>
                    <input type="hidden" id="ledOrigin" name="ledOrigin" value="{{ledOrigin}}">
                    <div class="origin-buttons">
                        <button type="button" class="origin-btn" data-origin="0" onclick="setLedOrigin(0)">Oben links</button>
                        <button type="button" class="origin-btn" data-origin="1" onclick="setLedOrigin(1)">Oben rechts</button>
                        <button type="button" class="origin-btn" data-origin="3" onclick="setLedOrigin(3)">Unten rechts</button>
                        <button type="button" class="origin-btn" data-origin="2" onclick="setLedOrigin(2)">Unten links</button>
                    </div>
                </div>
                <div class="row">
                    <label id="lblSsid">SSID</label>
                    <input name="ssid" value="{{ssid}}">
                </div>
                <div class="row">
                    <label id="lblPassword">Passwort</label>
                    <input name="pass" type="password">
                </div>
                <button id="btnSaveReboot" class="btn" type="submit">Speichern & Neustarten</button>
            </form>
            <p style="margin-top:12px"><a id="linkBack" href="/">Zurück</a></p>
        </div>

        <div class="card">
            <h3 id="ledStatusTitle">LED-Status (Live)</h3>
            <p id="ledStatusHint" style="margin-top:0">Aktive LEDs werden gelb dargestellt.</p>
            <div id="wordButtonsRows"></div>
            <button id="btnClearSelection" type="button" class="btn small" onclick="clearWordSelection()">Wortauswahl löschen</button>
            <div id="ledMatrix"></div>
        </div>
    </div>

    <script>
        const I18N = {
            de: {
                lang: 'Sprache:', title: 'Konfiguration', settings: 'Einstellungen', currentTime: 'Aktuelle Uhrzeit:', timeWords: 'Zeit in Worten:',
                testMode: 'Testmodus:', firstLed: 'Erste LED:', net: 'Netz:', uptime: 'Uptime:', lastEvent: 'Letzter WiFi-Event:', discReason: 'Disconnect Grund:',
                normalTime: 'Uhrzeitanzeige aktivieren', ntp: 'NTP-Server', timezone: 'Zeitzone (Stadt)', brightness: 'Helligkeit (1-10)', ledPin: 'LED-Pin',
                ledsPerRow: 'LEDs pro Reihe', wordRows: 'Wortzeilen', origin: 'LED-Startpunkt', password: 'Passwort', saveReboot: 'Speichern & Neustarten',
                back: 'Zurück', ledStatus: 'LED-Status (Live)', ledHint: 'Aktive LEDs werden gelb dargestellt.', clearSelection: 'Wortauswahl löschen', row: 'Reihe',
                originTopLeft: 'Oben links', originTopRight: 'Oben rechts', originBottomRight: 'Unten rechts', originBottomLeft: 'Unten links'
            },
            en: {
                lang: 'Language:', title: 'Configuration', settings: 'Settings', currentTime: 'Current time:', timeWords: 'Time in words:',
                testMode: 'Test mode:', firstLed: 'First LED:', net: 'Network:', uptime: 'Uptime:', lastEvent: 'Last Wi-Fi event:', discReason: 'Disconnect reason:',
                normalTime: 'Activate normal time display', ntp: 'NTP server', timezone: 'Timezone (City)', brightness: 'Brightness (1-10)', ledPin: 'LED pin',
                ledsPerRow: 'LEDs per row', wordRows: 'Word rows', origin: 'LED start point', password: 'Password', saveReboot: 'Save & Reboot',
                back: 'Back', ledStatus: 'LED status (Live)', ledHint: 'Active LEDs are shown in yellow.', clearSelection: 'Clear word selection', row: 'Row',
                originTopLeft: 'Top left', originTopRight: 'Top right', originBottomRight: 'Bottom right', originBottomLeft: 'Bottom left'
            }
        };
        let currentLang = localStorage.getItem('wc_lang') || 'de';
        function t(key) { return (I18N[currentLang] || I18N.de)[key] || key; }
        function applyI18n() {
            document.getElementById('langLabel').textContent = t('lang');
            document.getElementById('titleText').textContent = t('title');
            document.getElementById('settingsTitle').textContent = t('settings');
            document.getElementById('lblCurrentTime').textContent = t('currentTime');
            document.getElementById('lblTimeWords').textContent = t('timeWords');
            document.getElementById('lblTestMode').textContent = t('testMode');
            document.getElementById('lblFirstLed').textContent = t('firstLed');
            document.getElementById('lblNet').textContent = t('net');
            document.getElementById('lblUptime').textContent = t('uptime');
            document.getElementById('lblLastEvent').textContent = t('lastEvent');
            document.getElementById('lblDiscReason').textContent = t('discReason');
            document.getElementById('btnNormalTime').textContent = t('normalTime');
            document.getElementById('lblNtp').textContent = t('ntp');
            document.getElementById('lblTimezone').textContent = t('timezone');
            document.getElementById('lblBrightness').textContent = t('brightness');
            document.getElementById('lblLedPin').textContent = t('ledPin');
            document.getElementById('lblLedsPerRow').textContent = t('ledsPerRow');
            document.getElementById('lblWordRows').textContent = t('wordRows');
            document.getElementById('lblOrigin').textContent = t('origin');
            document.getElementById('lblPassword').textContent = t('password');
            document.getElementById('btnSaveReboot').textContent = t('saveReboot');
            document.getElementById('linkBack').textContent = t('back');
            document.getElementById('ledStatusTitle').textContent = t('ledStatus');
            document.getElementById('ledStatusHint').textContent = t('ledHint');
            document.getElementById('btnClearSelection').textContent = t('clearSelection');
            document.getElementById('langSelect').value = currentLang;
            document.querySelector('.origin-btn[data-origin="0"]').textContent = t('originTopLeft');
            document.querySelector('.origin-btn[data-origin="1"]').textContent = t('originTopRight');
            document.querySelector('.origin-btn[data-origin="3"]').textContent = t('originBottomRight');
            document.querySelector('.origin-btn[data-origin="2"]').textContent = t('originBottomLeft');
        }
        const LEDS_PER_ROW = 41;
        const WORD_ROWS = 10;
        const WORD_ROW_MAP = {
            ES: 1, IST: 1, FUENF: 1, ZEHN: 2, ZWANZIG: 2, DREI: 3, VIERTEL: 3, VOR: 4, NACH: 4, HALB: 5,
            ELF: 5, FUENF_H: 5, EINS: 6, ZWEI: 6, DREI_H: 7, VIER: 7, SECHS: 8, ACHT: 8, SIEBEN: 9,
            ZWOELF: 9, ZEHN_H: 10, NEUN: 10, UHR: 10
        };
        let liveLedStates = [];
        let wordMappings = {};
        const selectedWords = new Set();

        function setStatus(text, ok = true) {
            const el = document.getElementById('statusText');
            el.textContent = text;
            el.style.color = ok ? '#0a8f3f' : '#b00020';
        }

        function setLedOrigin(value) {
            document.getElementById('ledOrigin').value = String(value);
            document.querySelectorAll('.origin-btn').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.origin === String(value));
            });
        }

        function activateNormalTime() {
            fetch('/normaltime')
                .then(async (r) => {
                    const msg = await r.text();
                    if (!r.ok) throw new Error(msg || 'Fehler');
                    selectedWords.clear();
                    renderWordButtons();
                    setStatus(msg, true);
                    updateInfo();
                    updateLedMatrix();
                })
                .catch((e) => setStatus(e.message, false));
        }

        function updateInfo() {
            fetch('/api/info')
                .then((r) => r.json())
                .then((data) => {
                    document.getElementById('currentTime').textContent = data.currentTime || '-';
                    document.getElementById('timeWords').textContent = data.timeWords || '-';
                    document.getElementById('testMode').textContent = data.testMode ? 'Aktiv' : 'Inaktiv';
                    document.getElementById('firstLEDMode').textContent = data.firstLEDMode ? 'Aktiv' : 'Inaktiv';
                })
                .catch(() => {});
        }

        function formatUptime(ms) {
            const total = Math.max(0, Math.floor((ms || 0) / 1000));
            const h = Math.floor(total / 3600);
            const m = Math.floor((total % 3600) / 60);
            const s = total % 60;
            return `${h}h ${m}m ${s}s`;
        }

        function updateHealth() {
            fetch('/api/health')
                .then((r) => r.json())
                .then((data) => {
                    document.getElementById('healthWifi').textContent = `${data.wifiMode || '-'} / ${data.wifiStatus || '-'}`;
                    document.getElementById('healthIp').textContent = data.ip || '-';
                    document.getElementById('healthRssi').textContent = (data.rssi !== undefined) ? `${data.rssi} dBm` : '-';
                    document.getElementById('healthHeap').textContent = (data.freeHeap !== undefined) ? `${data.freeHeap} B` : '-';
                    document.getElementById('healthUptime').textContent = formatUptime(data.uptimeMs);
                    document.getElementById('healthEvent').textContent = data.lastWifiEvent || '-';
                    document.getElementById('healthDiscReason').textContent = (data.lastWifiDisconnectReason !== undefined) ? String(data.lastWifiDisconnectReason) : '-';
                })
                .catch(() => {});
        }

        function getWordRow(word) {
            return WORD_ROW_MAP[word] || 1;
        }

        function loadWordMappings() {
            fetch('/api/words')
                .then((r) => r.json())
                .then((data) => {
                    wordMappings = data || {};
                    renderWordButtons();
                    renderLedMatrix();
                })
                .catch(() => {});
        }

        function renderWordButtons() {
            const root = document.getElementById('wordButtonsRows');
            const byRow = Array.from({ length: WORD_ROWS }, () => []);

            Object.keys(wordMappings).forEach((word) => {
                const row = getWordRow(word);
                if (row >= 1 && row <= WORD_ROWS) byRow[row - 1].push(word);
            });

            let html = '';
            for (let row = 0; row < WORD_ROWS; row++) {
                const words = byRow[row];
                if (!words.length) continue;
                html += `<div class="word-row"><span class="word-row-label">${t('row')} ${row + 1}</span>`;
                for (const word of words) {
                    const activeClass = selectedWords.has(word) ? 'active' : '';
                    html += `<button type="button" class="word-btn ${activeClass}" onclick="toggleWord('${word}')">${word}</button>`;
                }
                html += '</div>';
            }
            root.innerHTML = html;
        }

        function toggleWord(word) {
            if (selectedWords.has(word)) selectedWords.delete(word);
            else selectedWords.add(word);
            renderWordButtons();
            syncWordPreview();
            renderLedMatrix();
        }

        function clearWordSelection() {
            selectedWords.clear();
            renderWordButtons();
            syncWordPreview();
            renderLedMatrix();
        }

        function syncWordPreview() {
            const words = Array.from(selectedWords).join(',');
            fetch('/api/preview-words', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `words=${encodeURIComponent(words)}`
            })
            .then(async (r) => {
                const txt = await r.text();
                if (!r.ok) throw new Error(txt || 'Fehler bei Vorschau');
                updateInfo();
                updateLedMatrix();
            })
            .catch((e) => setStatus(e.message, false));
        }

        function buildPreviewIndices() {
            const preview = new Set();
            selectedWords.forEach((word) => {
                const leds = wordMappings[word];
                if (!Array.isArray(leds)) return;
                const row = getWordRow(word) - 1;
                if (row < 0 || row >= WORD_ROWS) return;
                leds.forEach((pos) => {
                    const idx = row * LEDS_PER_ROW + Number(pos);
                    if (idx >= 0 && idx < WORD_ROWS * LEDS_PER_ROW) preview.add(idx);
                });
            });
            return preview;
        }

        function renderLedMatrix() {
            const preview = buildPreviewIndices();
            let h = '<table><tr>';
            for (let c = 0; c < LEDS_PER_ROW; c++) h += `<th>${c}</th>`;
            h += '</tr>';
            for (let r = 0; r < WORD_ROWS; r++) {
                h += '<tr>';
                for (let c = 0; c < LEDS_PER_ROW; c++) {
                    const i = r * LEDS_PER_ROW + c;
                    const active = liveLedStates[i] === 1;
                    const inPreview = preview.has(i);
                    const className = `${active ? 'active' : ''} ${inPreview ? 'preview' : ''}`.trim();
                    h += `<td class="${className}" title="LED ${i}"></td>`;
                }
                h += '</tr>';
            }
            h += '</table>';
            document.getElementById('ledMatrix').innerHTML = h;
        }

        function updateLedMatrix() {
            fetch('/api/leds')
                .then((r) => r.json())
                .then((leds) => {
                    liveLedStates = leds || [];
                    renderLedMatrix();
                })
                .catch(() => {});
        }

        window.addEventListener('load', () => {
            if (!I18N[currentLang]) currentLang = 'de';
            document.getElementById('langSelect').addEventListener('change', (e) => {
                currentLang = e.target.value;
                localStorage.setItem('wc_lang', currentLang);
                applyI18n();
                renderWordButtons();
            });
            setLedOrigin(parseInt('{{ledOrigin}}', 10) || 0);
            document.getElementById('timezoneCity').value = '{{timezoneCity}}';
            applyI18n();
            loadWordMappings();
            updateInfo();
            updateHealth();
            updateLedMatrix();
            setInterval(updateInfo, 1000);
            setInterval(updateHealth, 2000);
            setInterval(updateLedMatrix, 1000);
        });
    </script>
</body>
</html>
