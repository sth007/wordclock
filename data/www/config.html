<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Wordclock Config</title>
    <style>
        body { font-family: sans-serif; max-width: 1100px; margin: 24px auto; padding: 0 16px; }
        .grid { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; gap: 20px; align-items: start; }
        .card { background: #f8f8f8; border: 1px solid #ddd; border-radius: 6px; padding: 14px; }
        .card h3 { margin: 0 0 10px 0; }
        form input { width: 100%; padding: 10px; box-sizing: border-box; }
        form label { font-weight: 600; display: block; margin-bottom: 4px; }
        .btn { padding: 10px 14px; border: none; border-radius: 4px; cursor: pointer; background: #007bff; color: #fff; }
        .btn:hover { background: #005fc5; }
        .btn.secondary { background: #0a8f3f; }
        .btn.secondary:hover { background: #086f32; }
        .row { margin-bottom: 12px; }
        #statusText { margin-top: 8px; min-height: 20px; }
        #clockInfo { margin: 8px 0 12px 0; font-size: 14px; }
        #clockInfo strong { color: #111; }
        #ledMatrix { overflow-x: auto; border: 1px solid #ddd; border-radius: 4px; background: #fff; padding: 6px; }
        #ledMatrix table { border-collapse: collapse; }
        #ledMatrix th { width: 18px; height: 18px; font-size: 10px; color: #666; border: 1px solid transparent; text-align: center; }
        #ledMatrix td { width: 18px; height: 18px; border: 1px solid #999; background: #ddd; }
        #ledMatrix td.active { background: #ffeb3b; }
        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <h2>Konfiguration</h2>
    <div class="grid">
        <div class="card">
            <h3>Einstellungen</h3>
            <div id="clockInfo">
                <div>Aktuelle Uhrzeit: <strong id="currentTime">{{currentTime}}</strong></div>
                <div>Zeit in Worten: <strong id="timeWords">{{timeWords}}</strong></div>
                <div>Testmodus: <strong id="testMode">{{testMode}}</strong>, Erste LED: <strong id="firstLEDMode">{{firstLEDMode}}</strong></div>
            </div>
            <div class="row">
                <button type="button" class="btn secondary" onclick="activateNormalTime()">Uhrzeitanzeige aktivieren</button>
                <div id="statusText"></div>
            </div>
            <form method="POST" action="/config">
                <div class="row">
                    <label>NTP-Server</label>
                    <input name="ntpServer" value="{{ntpServer}}">
                </div>
                <div class="row">
                    <label>GMT Offset (Stunden)</label>
                    <input name="gmtOffset" type="number" value="{{gmtOffset}}">
                </div>
                <div class="row">
                    <label>Sommerzeit Offset (Stunden)</label>
                    <input name="daylightOffset" type="number" value="{{daylightOffset}}">
                </div>
                <div class="row">
                    <label>Helligkeit (1-10)</label>
                    <input name="brightness" type="number" min="1" max="10" value="{{brightness}}">
                </div>
                <div class="row">
                    <label>LED-Pin</label>
                    <input name="ledPin" type="number" value="{{ledPin}}">
                </div>
                <div class="row">
                    <label>LEDs pro Reihe</label>
                    <input name="ledsPerRow" type="number" value="{{ledsPerRow}}">
                </div>
                <div class="row">
                    <label>Wortzeilen</label>
                    <input name="wordRows" type="number" value="{{wordRows}}">
                </div>
                <div class="row">
                    <label>SSID</label>
                    <input name="ssid" value="{{ssid}}">
                </div>
                <div class="row">
                    <label>Passwort</label>
                    <input name="pass" type="password">
                </div>
                <button class="btn" type="submit">Speichern & Neustarten</button>
            </form>
            <p style="margin-top:12px"><a href="/">Zurück</a></p>
        </div>

        <div class="card">
            <h3>LED-Status (Live)</h3>
            <p style="margin-top:0">Aktive LEDs werden gelb dargestellt.</p>
            <div id="ledMatrix"></div>
        </div>
    </div>

    <script>
        function setStatus(text, ok = true) {
            const el = document.getElementById('statusText');
            el.textContent = text;
            el.style.color = ok ? '#0a8f3f' : '#b00020';
        }

        function activateNormalTime() {
            fetch('/normaltime')
                .then(async (r) => {
                    const msg = await r.text();
                    if (!r.ok) throw new Error(msg || 'Fehler');
                    setStatus(msg, true);
                    updateInfo();
                    updateLedMatrix();
                })
                .catch((e) => setStatus(e.message, false));
        }

        function updateInfo() {
            fetch('/api/info')
                .then((r) => r.json())
                .then((data) => {
                    document.getElementById('currentTime').textContent = data.currentTime || '-';
                    document.getElementById('timeWords').textContent = data.timeWords || '-';
                    document.getElementById('testMode').textContent = data.testMode ? 'Aktiv' : 'Inaktiv';
                    document.getElementById('firstLEDMode').textContent = data.firstLEDMode ? 'Aktiv' : 'Inaktiv';
                })
                .catch(() => {});
        }

        function updateLedMatrix() {
            fetch('/api/leds')
                .then((r) => r.json())
                .then((leds) => {
                    let h = '<table><tr>';
                    for (let c = 0; c < 41; c++) h += `<th>${c}</th>`;
                    h += '</tr>';
                    for (let r = 0; r < 10; r++) {
                        h += '<tr>';
                        for (let c = 0; c < 41; c++) {
                            const i = r * 41 + c;
                            h += `<td class="${leds[i] === 1 ? 'active' : ''}" title="LED ${i}"></td>`;
                        }
                        h += '</tr>';
                    }
                    h += '</table>';
                    document.getElementById('ledMatrix').innerHTML = h;
                })
                .catch(() => {});
        }

        window.addEventListener('load', () => {
            updateInfo();
            updateLedMatrix();
            setInterval(updateInfo, 1000);
            setInterval(updateLedMatrix, 1000);
        });
    </script>
</body>
</html>
